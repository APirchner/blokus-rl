[package]
name = "blokus-rl"
version = "0.2.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "blokus_rl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"

[profile.release]
# rustc's built-in debuginfo stripping yields dylibs that newer macOS dyld rejects
# ("mis-aligned LINKEDIT string pool")
strip = "none"
