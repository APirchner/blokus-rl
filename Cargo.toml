[package]
name = "blokus-rl"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "blokus_rl"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# the Python extension, Rust users of the library can turn it off with `default-features = false`
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "game"
harness = false

[profile.release]
# rustc's built-in debuginfo stripping yields dylibs that newer macOS dyld rejects
# ("mis-aligned LINKEDIT string pool")
strip = "none"
